name: Validate toolkit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check public package
        run: python scripts/check_public_package.py
      - name: Validate metadata
        run: python scripts/validate_pack.py
      - name: Verify release checksums
        run: python scripts/verify_checksums.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline hidden-oracle discrimination (no agent, no API)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/agent_eval_offline_smoke.py --strict-runtimes
