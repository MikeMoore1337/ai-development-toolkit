name: Validate toolkit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check public package
        run: python scripts/check_public_package.py
      - name: Validate provenance inventory (not release permission)
        run: python scripts/validate_provenance.py --mode inventory --report "${{ runner.temp }}/provenance-inventory.json"
      - name: Validate metadata
        run: python scripts/validate_pack.py
      - name: Validate links profiles and exclusive workflows (offline)
        run: python scripts/validate_quality.py
      - name: Verify release checksums
        run: python scripts/verify_checksums.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install official Agent Skills reference validator (pinned source)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          skills-ref --version
      - name: Official Agent Skills validation (all declared packs)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        timeout-minutes: 8
        run: python scripts/validate_with_skills_ref.py --scope all --timeout 15
      - name: Official validator real-CLI integration regressions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        timeout-minutes: 8
        run: python -m unittest discover -s tests -p integration_skills_ref.py -v
      - name: Offline hidden-oracle discrimination (no agent, no API)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/agent_eval_offline_smoke.py --strict-runtimes
      - name: Checkout pinned Hermes contract (source only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/checkout@v7
        with:
          repository: MikeMoore1337/hermes
          ref: db7ed22d4faef39af3d5aafa0cc6f20b91b23a3a
          path: .hermes-compat
          persist-credentials: false
      - name: Offline Hermes/Toolkit compatibility (no agent, no API)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/agent_eval_hermes_contract.py --hermes-root .hermes-compat
