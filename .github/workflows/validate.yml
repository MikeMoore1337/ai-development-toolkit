name: Validate toolkit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Superseded PR validations must not leave orphaned runs consuming runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Reject references to owner projects in public Markdown (offline)
        run: python scripts/validate_public_docs_neutrality.py
      - name: Ruff Python correctness checks (pinned, Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.17.1"
          ruff check --isolated --target-version py312 --select F821,F822,F823,E9 scripts tests
          # Informational pilot: count unused imports and style findings without reformatting.
          ruff check --isolated --target-version py312 --select F401,F811,F841,E4,E7 --statistics --exit-zero scripts tests
          printf 'def example():\n    return undefined_identifier\n' > "$RUNNER_TEMP/ruff-negative.py"
          if ruff check --isolated --select F821 "$RUNNER_TEMP/ruff-negative.py"; then
            echo "FAIL: Ruff did not detect the synthetic undefined name"
            exit 1
          fi
      - name: Validate Actions syntax and expressions (pinned, Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -version
          "$RUNNER_TEMP/actionlint/actionlint" -no-color -shellcheck= -pyflakes=
          printf '%s\n' 'name: Negative fixture' 'on: push' 'jobs:' '  invalid:' \
            '    needs: [missing_job]' '    runs-on: ubuntu-latest' \
            '    steps:' '      - run: echo test' |
            "$RUNNER_TEMP/actionlint/actionlint" -no-color -shellcheck= -pyflakes= -stdin-filename synthetic.yml - && {
              echo "FAIL: actionlint missed a synthetic missing dependency"
              exit 1
            } || test "$?" -eq 1
      - name: Check public package
        run: python scripts/check_public_package.py
      - name: Validate provenance inventory (not release permission)
        run: python scripts/validate_provenance.py --mode inventory --report "${{ runner.temp }}/provenance-inventory.json"
      - name: Confirm exact owner-reviewed release source snapshot (technical gate)
        run: python scripts/validate_provenance.py --mode release --report "${{ runner.temp }}/provenance-release-preflight.json"
      - name: Validate normalized dependency maintenance fixtures (offline)
        run: python scripts/validate_dependency_maintenance.py
      - name: Offline data contracts, incremental pipeline and 25 negative oracles
        run: python scripts/validate_data_engineering.py
      - name: Offline end-to-end workflow and 42 negative mutations
        run: python scripts/validate_end_to_end_workflow.py
      - name: Final S1-S6 acceptance - novice/expert, 61 negative oracles (no models)
        run: python scripts/validate_final_acceptance.py
      - name: Offline Maintenance and Support evidence gates
        run: python scripts/validate_maintenance_support.py
      - name: Validate metadata
        run: python scripts/validate_pack.py
      - name: Verify offline AI client contracts (no models or agent runtimes)
        run: python scripts/verify_client_compatibility.py
      - name: Validate offline tool integration and authority contracts (#69)
        run: python scripts/validate_tool_integrations.py
      - name: Validate links profiles and exclusive workflows (offline)
        run: python scripts/validate_quality.py
      - name: Check skill selection descriptions with offline lexical fixtures
        run: python scripts/skill_routing_eval.py --strict
      - name: Report untuned holdout routing baseline (diagnostic, not a release gate)
        run: python scripts/skill_routing_eval.py --holdout fixtures/skill_routing_holdout.json
      - name: Report fresh bilingual untuned routing stress diagnostic (no accuracy gate)
        run: python scripts/skill_routing_eval.py --holdout fixtures/skill_routing_untuned_20261024.json
      - name: Check Russian translation source revisions (warnings do not block unrelated PRs)
        run: python scripts/check_translation_freshness.py
      - name: Verify per-skill quality metrics (offline source only)
        run: python scripts/skill_quality_metrics.py --check-repeat --json-report "${{ runner.temp }}/skill-quality.json" --summary
      - name: Preserve per-skill quality report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-quality-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/skill-quality.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify release checksums
        run: python scripts/verify_checksums.py
      - name: Offline AI contracts (synthetic only, zero provider calls)
        run: python scripts/validate_ai_contracts.py
      - name: Offline reliability oracle and known-bad mutation check (no external services)
        run: python scripts/validate_reliability.py
      - name: Unit tests
        # Typical runtime is <1 minute; bound hangs and preserve the last test in logs.
        timeout-minutes: 5
        run: python -u -m unittest discover -s tests -v
      - name: Test portable MCP, updater and plugin source packages (offline)
        timeout-minutes: 5
        run: |
          python -u -m unittest discover -s integrations/personal-mcp/adt-personal/tests -p "test_*.py" -v
          python -u -m unittest discover -s integrations/tests -p "test_*.py" -v
      - name: Check exported source archive before publication (offline)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          git archive --format=zip --output="$staging/source.zip" HEAD
          mkdir "$staging/unpacked"
          python - "$staging/source.zip" "$staging/unpacked" <<'PY'
          import pathlib
          import stat
          import sys
          import zipfile

          root = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for entry in archive.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  if (not entry.filename or path.is_absolute() or
                          ".." in path.parts or "\\" in entry.filename or
                          stat.S_IFMT(entry.external_attr >> 16) == stat.S_IFLNK):
                      raise SystemExit("Unsafe source archive entry")
              archive.extractall(root)
          PY
          python scripts/verify_checksums.py --archive-root "$staging/unpacked"
          python scripts/validate_provenance.py --root "$staging/unpacked" --mode release --report "$RUNNER_TEMP/provenance-archive-preflight.json"
      - name: Preserve provenance JSON report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provenance-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/provenance-inventory.json
            ${{ runner.temp }}/provenance-release-preflight.json
            ${{ runner.temp }}/provenance-archive-preflight.json
          if-no-files-found: ignore
      - name: Install official Agent Skills reference validator (pinned source)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          skills-ref --version
      - name: Official Agent Skills validation (all declared packs)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        timeout-minutes: 8
        run: python scripts/validate_with_skills_ref.py --scope all --timeout 15
      - name: Official validator real-CLI integration regressions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        timeout-minutes: 8
        run: python -m unittest discover -s tests -p integration_skills_ref.py -v
      - name: Offline hidden-oracle discrimination (no agent, no API)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/agent_eval_offline_smoke.py --strict-runtimes
      - name: Checkout pinned Hermes contract (source only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MikeMoore1337/hermes
          ref: db7ed22d4faef39af3d5aafa0cc6f20b91b23a3a
          path: .hermes-compat
          persist-credentials: false
      - name: Offline Hermes/Toolkit compatibility (no agent, no API)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/agent_eval_hermes_contract.py --hermes-root .hermes-compat


  # The archive is an expiring CI source candidate, NEVER a published Release.
  # Require success across Linux, Windows and macOS before exposing bytes.
  integration-source-candidates:
    name: Integration source archives (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, macos-portability]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Validate exact source snapshot before building
        run: |
          python scripts/verify_checksums.py
          python scripts/validate_provenance.py --mode release --report "$RUNNER_TEMP/adt-package-rights.json"
      - name: Build and verify integration source candidates (not installed)
        env:
          OUT_DIR: ${{ runner.temp }}/adt-integration-sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          python integrations/build_packages.py --output "$OUT_DIR" > "$OUT_DIR/build-result.json"
          python - <<'PYCODE'
          import hashlib, json, os, pathlib, zipfile
          out = pathlib.Path(os.environ['OUT_DIR']).resolve()
          data = json.loads((out / 'build-result.json').read_text(encoding='utf-8'))
          if (data.get('status') != 'SOURCE_ARCHIVES_BUILT_NOT_INSTALLED'
                  or len(data.get('results', [])) != 2):
              raise SystemExit('BLOCKED: unexpected source bundle set')
          seen = set()
          for result in data['results']:
              path = pathlib.Path(result['path']).resolve()
              if (path.parent != out or path.suffix != '.zip' or path.name in seen
                      or path.stat().st_size > 32 * 1024 * 1024):
                  raise SystemExit('BLOCKED: unexpected bundle path or size')
              seen.add(path.name)
              if hashlib.sha256(path.read_bytes()).hexdigest() != result['sha256']:
                  raise SystemExit('BLOCKED: bundle SHA256 mismatch')
              with zipfile.ZipFile(path) as archive:
                  if archive.testzip() is not None or len(archive.namelist()) != result['members']:
                      raise SystemExit('BLOCKED: corrupt bundle')
                  if 'Personal-MCP-' in path.name and not {
                      'adt-personal/mcp/adt_mcp.py',
                      'adt-personal/mcp/adt_discovery.py',
                  }.issubset(archive.namelist()):
                      raise SystemExit('BLOCKED: incomplete MCP 0.1.10 modules')
          (out / 'SOURCE_EVIDENCE.json').write_text(
              json.dumps({
                  'git_sha': os.environ['GITHUB_SHA'],
                  'git_ref': os.environ['GITHUB_REF'],
                  'status': 'CI_SOURCE_CANDIDATE_NOT_GITHUB_RELEASE',
                  'installed_mcp': 'NOT_VERIFIED',
                  'chatgpt_live_plugin': 'NOT_UPDATED',
                  'source_archives': data['results'],
              }, indent=2) + '\n', encoding='utf-8')
          print('Verified', ', '.join(sorted(seen)))
          PYCODE
      - name: Preserve candidate ZIPs and SHA256 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adt-integration-sources-${{ github.sha }}
          path: |
            ${{ runner.temp }}/adt-integration-sources/*.zip
            ${{ runner.temp }}/adt-integration-sources/*.json
            ${{ runner.temp }}/adt-package-rights.json
          if-no-files-found: error
          retention-days: 14

  macos-portability:
    name: macOS portability (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Confirm macOS architecture
        run: |
          python -c "import platform,sys; print('SYSTEM=',platform.system(),'ARCH=',platform.machine(),'PY=',sys.version)"
      - name: Offline managed installation and rollback on macOS
        # macOS /var is a system symlink to /private/var. Keep the security
        # symlink gate strict; put synthetic test fixtures under runner.temp.
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m unittest discover -s tests -p test_skill_manager.py -v
          python -m unittest discover -s tests -p test_adt_cli.py -v
          python -m unittest discover -s tests -p test_platform_guides.py -v
      - name: Validate local Toolkit MCP stdio and safe config on macOS
        # /var links to /private/var on macOS; security guards must stay strict.
        # Restrict disposable test fixtures to the runner's non-linked temp root.
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m unittest discover -s tests -p test_toolkit_mcp.py -v
      - name: Verify personal MCP and plugin packages on macOS (offline)
        env:
          TMPDIR: ${{ runner.temp }}
        timeout-minutes: 5
        run: |
          python -u -m unittest discover -s integrations/personal-mcp/adt-personal/tests -p "test_*.py" -v
          python -u -m unittest discover -s integrations/tests -p "test_*.py" -v
      - name: Verify checked-out file integrity and provenance
        run: |
          python scripts/verify_checksums.py
          python scripts/validate_provenance.py --mode inventory --report "$RUNNER_TEMP/macos-provenance.json"
