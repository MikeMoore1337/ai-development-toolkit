name: Cisco MCP static smoke

on:
  pull_request:
    paths:
      - 'scripts/cisco_mcp_gate.py'
      - 'scripts/toolkit_mcp.py'
      - 'integrations/personal-mcp/adt-personal/mcp/adt_mcp.py'
      - '.github/workflows/cisco-mcp-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/cisco_mcp_gate.py'
      - 'scripts/toolkit_mcp.py'
      - 'integrations/personal-mcp/adt-personal/mcp/adt_mcp.py'
      - '.github/workflows/cisco-mcp-smoke.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-only-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # pinned
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Real pinned Cisco static scan - Personal MCP
        run: python scripts/cisco_mcp_gate.py --scope personal
      - name: Real pinned Cisco static scan - Project MCP
        run: python scripts/cisco_mcp_gate.py --scope project
