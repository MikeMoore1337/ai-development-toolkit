name: #439 pinned ECC source-only comparator TEMP
on:
  push:
    branches:
      - test/439-independent-context-acceptance
    paths:
      - .github/workflows/ecc-439-comparator-temp.yml
permissions:
  contents: read
jobs:
  pinned-ecc-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact ECC source (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: affaan-m/ECC
          ref: 25278e7d7b6cf6e6a4e7a6c8e10f14ff22f0eb5b
          path: upstream
          persist-credentials: false
      - name: Preflight exact SHA, license, package and source-only interface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "25278e7d7b6cf6e6a4e7a6c8e10f14ff22f0eb5b"
          grep -Fq 'MIT License' upstream/LICENSE
          test -f upstream/package-lock.json
          test -f upstream/scripts/profile.js
          test -f upstream/manifests/context-profiles/lean@1.json
          test -f upstream/manifests/context-profiles/full@1.json
          node - <<'NODE'
          const pkg = require('./upstream/package.json');
          if (pkg.license !== 'MIT' || pkg.dependencies['ajv'] !== '8.20.0' ||
              pkg.dependencies['js-yaml'] !== '4.3.2') process.exit(1);
          const fs = require('fs');
          const cli = fs.readFileSync('./upstream/scripts/profile.js','utf8');
          for (const cmd of ["'show'", "'preview'", "'explain'"]) {
            if (!cli.includes(cmd)) process.exit(1);
          }
          console.log('ECC_PIN_AND_LICENSE=PASS');
          console.log('ECC_NODE_VERSION=' + process.version);
          NODE
      - name: Install pinned NPM runtime dependencies in runner temp only (no lifecycle scripts)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ecc439deps"
          cp upstream/package.json upstream/package-lock.json "$RUNNER_TEMP/ecc439deps/"
          npm ci --prefix "$RUNNER_TEMP/ecc439deps" --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Snapshot tracked source after dependency installation
        shell: bash
        run: |
          git -C upstream status --porcelain --untracked-files=no > "$RUNNER_TEMP/ecc439-before-cli-status.txt"
          echo 'ECC_PRE_CLI_TRACKED_CHANGES:'
          cat "$RUNNER_TEMP/ecc439-before-cli-status.txt"
          test ! -s "$RUNNER_TEMP/ecc439-before-cli-status.txt"
      - name: Run original show/preview/explain on synthetic selectors without activation
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ecc439home"
          export HOME="$RUNNER_TEMP/ecc439home"
          export NODE_PATH="$RUNNER_TEMP/ecc439deps/node_modules"
          cd upstream
          node scripts/profile.js show lean@1 --json > "$RUNNER_TEMP/lean-show.json"
          node scripts/profile.js show full@1 --json > "$RUNNER_TEMP/full-show.json"
          node scripts/profile.js preview lean@1 --target codex --selection auto --json > "$RUNNER_TEMP/lean-preview.json"
          node scripts/profile.js preview full@1 --target codex --selection manual --json > "$RUNNER_TEMP/full-preview.json"
          node scripts/profile.js explain skill:context-budget --target codex --json > "$RUNNER_TEMP/explain.json"
          if node scripts/profile.js preview lean@1 --target codex --exclude skill:configure-ecc --json > "$RUNNER_TEMP/negative.json"; then
            echo "FAIL: original ECC permitted exclusion of required skill"; exit 1
          fi
          node - <<'NODE'
          const fs = require('fs'), path = require('path');
          const root = process.env.RUNNER_TEMP;
          const read = name => JSON.parse(fs.readFileSync(path.join(root,name),'utf8'));
          const showLean = read('lean-show.json'), showFull = read('full-show.json');
          const lean=read('lean-preview.json'), full=read('full-preview.json');
          const explain=read('explain.json'), negative=read('negative.json');
          if (showLean.status !== 'success' || showFull.status !== 'success' ||
              lean.status !== 'warning' || full.status !== 'warning' ||
              explain.status !== 'success' || negative.status !== 'error') {
            throw new Error('Unexpected ECC inspection statuses');
          }
          if (lean.activation !== 'unobserved' || full.activation !== 'unobserved' ||
              lean.plan.active !== false || full.plan.active !== false) {
            throw new Error('ECC incorrectly reports activation');
          }
          if (!lean.plan.selectedIds.includes('skill:configure-ecc') ||
              !lean.plan.selectedIds.includes('skill:context-budget') ||
              !lean.plan.selectedIds.includes('skill:ecc-guide')) {
            throw new Error('ECC lean mandatory discovery skills missing');
          }
          if (lean.plan.estimate.method !== 'utf8-bytes-div-4@1' ||
              lean.plan.estimate.budgetTokens !== 8000 ||
              lean.plan.estimate.budgetMode !== 'blocking' ||
              full.plan.estimate.budgetMode !== 'report-only') {
            throw new Error('ECC source token estimation mismatch');
          }
          if (lean.plan.estimate.nativeTokens !== null ||
              lean.plan.estimate.wholeScopeTokens !== null ||
              full.plan.estimate.nativeTokens !== null) {
            throw new Error('ECC returned fabricated native token costs');
          }
          console.log('ECC_ORIGINAL_SHOW_PREVIEW_EXPLAIN=PASS');
          console.log('ECC_REQUIRED_EXCLUSION_FAIL_CLOSED=PASS');
          console.log('ECC_ESTIMATED_TOKENS_NOT_MEASURED=PASS');
          console.log('ECC_LEAN_SELECTED_COUNT=' + lean.plan.selectedIds.length);
          console.log('ECC_FULL_SELECTED_COUNT=' + full.plan.selectedIds.length);
          console.log('ECC_LEAN_RENDERED_METADATA_BYTES=' + lean.plan.estimate.renderedBytes);
          console.log('ECC_FULL_RENDERED_METADATA_BYTES=' + full.plan.estimate.renderedBytes);
          console.log('ECC_LEAN_ESTIMATED_TOKENS=' + lean.plan.estimate.estimatedTokens);
          console.log('ECC_FULL_ESTIMATED_TOKENS=' + full.plan.estimate.estimatedTokens);
          NODE
          git status --porcelain --untracked-files=no > "$RUNNER_TEMP/ecc439-after-cli-status.txt"
          echo 'ECC_POST_CLI_TRACKED_CHANGES:'
          cat "$RUNNER_TEMP/ecc439-after-cli-status.txt"
          if test ! -s "$RUNNER_TEMP/ecc439-after-cli-status.txt" && cmp -s "$RUNNER_TEMP/ecc439-before-cli-status.txt" "$RUNNER_TEMP/ecc439-after-cli-status.txt"; then
            echo 'ECC_READONLY_NO_ADDITIONAL_TRACKED_CHANGES=PASS'
          else
            echo 'ECC_READONLY_NO_ADDITIONAL_TRACKED_CHANGES=FAIL'
            git diff --name-only
            exit 1
          fi
