name: Paperclip isolated zero-spend smoke

on:
  # Temporary branch-only trigger to validate checksum-update commits.
  push:
    branches: [experiment/paperclip-zero-spend-smoke]
  pull_request:
    # PR metadata edits can explicitly re-evaluate the experiment without merging.
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - '.github/workflows/paperclip-pilot.yml'
      - 'experiments/paperclip/**'

permissions:
  contents: read

concurrency:
  group: paperclip-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  toolkit-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install offline validator dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify provenance registry
        run: python scripts/validate_provenance.py --mode inventory
      - name: Verify publication gate
        run: python scripts/validate_provenance.py --mode release
      - name: Verify complete checksum inventory
        run: python scripts/verify_checksums.py
      - name: Validate Toolkit metadata
        run: python scripts/validate_pack.py
      - name: Verify Toolkit regression tests
        timeout-minutes: 5
        run: python -m unittest discover -s tests -v

  local-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Verify isolated Paperclip server and Toolkit skill import
        env:
          PAPERCLIP_VERSION: '2026.1012.0'
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          command -v python3
          test -f .agents/skills/minimal-safe-change/SKILL.md
          # Diagnose anonymous GitHub API access without ever passing a token.
          # Only HTTP codes are logged, never payloads or authorization.
          for endpoint in \
            "https://api.github.com/repos/MikeMoore1337/ai-development-toolkit" \
            "https://api.github.com/repos/MikeMoore1337/ai-development-toolkit/commits/main"; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 15 --header 'Accept: application/vnd.github+json' \
              "$endpoint" || true)"
            echo "ANONYMOUS_GITHUB_API: status=$status endpoint=$endpoint"
          done
          mkdir -p "$RUNNER_TEMP/paperclip-pilot"
          timeout 700s npx --yes --registry https://registry.npmjs.org "paperclipai@${PAPERCLIP_VERSION}" onboard \
            --yes --bind loopback --no-install-service --data-dir "$RUNNER_TEMP/paperclip-pilot" \
            > "$RUNNER_TEMP/paperclip-pilot-boot.log" 2>&1 &
          bootstrap_pid=$!
          trap 'kill "$bootstrap_pid" 2>/dev/null || true' EXIT
          up=0
          for i in $(seq 1 120); do
            if curl --noproxy '*' --silent --show-error --fail \
              --max-time 2 http://127.0.0.1:3100/api/health \
              > "$RUNNER_TEMP/paperclip-health.json" 2>/dev/null; then
              up=1
              break
            fi
            if ! kill -0 "$bootstrap_pid" 2>/dev/null; then
              echo 'Paperclip bootstrap exited before readiness (logs withheld to protect local keys)'
              exit 1
            fi
            sleep 2
          done
          if [ "$up" != '1' ]; then
            echo 'Paperclip did not become ready on 127.0.0.1:3100 (logs withheld)'
            exit 1
          fi
          python3 experiments/paperclip/smoke.py
          # Board-only API flow: no agents, LLM providers or production data.
          python3 experiments/paperclip/control_plane.py create "$RUNNER_TEMP/paperclip-board-receipt.json"
          # A fresh Python process independently reads the persisted API state.
          python3 experiments/paperclip/control_plane.py recover "$RUNNER_TEMP/paperclip-board-receipt.json"
