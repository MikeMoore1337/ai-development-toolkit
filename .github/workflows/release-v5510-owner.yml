name: Publish Toolkit v5.5.10 (explicit owner issue command)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: owner-reviewed-source-release-v5.5.10
  cancel-in-progress: false

jobs:
  publish:
    name: Owner-approved exact-SHA v5.5.10 publication
    if: >-
      github.repository == 'MikeMoore1337/ai-development-toolkit' &&
      github.event.issue.number == 437 &&
      github.event.comment.user.login == 'MikeMoore1337' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'PUBLISH_TOOLKIT_v5.5.10 SHA=')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_COMMAND: ${{ github.event.comment.body }}
    steps:
      - name: Require exact owner authorization command without shell interpolation
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          command = os.environ['RELEASE_COMMAND']
          match = re.fullmatch(r'PUBLISH_TOOLKIT_v5[.]5[.]10 SHA=([0-9a-f]{40}) OWNER_SOURCE_APPROVAL=YES', command)
          if not match:
              raise SystemExit('BLOCKED: exact owner/rights command missing or malformed')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write('RELEASE_SHA=' + match.group(1) + '\n')
          print('EXACT_OWNER_COMMAND_ACCEPTED; release rights are owner-declared, not independently audited')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify exact merged main and all six CI checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$RELEASE_SHA"
          python scripts/verify_checksums.py
          python scripts/validate_provenance.py --mode release
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/release-checks.json"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'release-checks.json'), encoding='utf-8') as fh:
              data = json.load(fh)
          required = (
              'tests (ubuntu-latest, 3.12)',
              'tests (ubuntu-latest, 3.13)',
              'tests (windows-latest, 3.14)',
              'macOS portability (macos-15, Python 3.12)',
              'macOS portability (macos-15-intel, Python 3.12)',
              'Integration source archives (main only)',
          )
          checks = data.get('check_runs', [])
          if data.get('total_count', 101) > 100:
              raise SystemExit('BLOCKED: incomplete CI check listing')
          for name in required:
              matches = [c for c in checks if c.get('name') == name]
              if len(matches) != 1 or matches[0].get('status') != 'completed' or matches[0].get('conclusion') != 'success':
                  raise SystemExit('BLOCKED: required exact-SHA job not green: ' + name)
          print('EXACT_MAIN_CI=6_OF_6_PASS')
          PY
      - name: Mandatory read-only local and remote pre-tag check
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pre_tag_preflight.py --tag v5.5.10 --sha "$RELEASE_SHA"
      - name: Create immutable annotated tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$RELEASE_SHA"
          tag_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag=v5.5.10 \
            -f message="AI Development Toolkit v5.5.10: owner-approved exact source $RELEASE_SHA; client E2E and independent outcome witness NOT_VERIFIED" \
            -f object="$RELEASE_SHA" -f type=commit --jq '.sha')"
          test -n "$tag_sha"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/tags/v5.5.10 -f sha="$tag_sha" >/dev/null
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # AI Development Toolkit v5.5.10
          
          Source release with Native Eval Capsules / Receipts integrity improvements (#437), plus cumulative changes in Observability (#434), Memory (#338), Windows source compatibility (#450), routing evidence and documentation.
          
          **Evidence boundary:** This tagged source is not proof of real AI-client activation, model-quality improvement or independent outcome/witness signatures. A separate opt-in digest comparison only verifies consistency with a caller-supplied previously trusted SHA256 value. No automatic client/plugin update and no mandatory external ECC runtime.
          
          Exact source, artifacts and rights scope are subject to the published tag, checksum registry, provenance release gates and the owner's separate approval record in Issue #437. Independent employer/third-party title verification is not attested.
          EOF
          printf '\nExact tagged source SHA: `%s`\n' "$RELEASE_SHA" >> "$RUNNER_TEMP/release-notes.md"
          gh release create v5.5.10 --target "$RELEASE_SHA" \
            --title 'AI Development Toolkit v5.5.10' \
            --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Confirm tagged commit and published Release
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v5.5.10" --jq '.object.sha')"
          tagged_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')"
          test "$tagged_commit" = "$RELEASE_SHA"
          published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v5.5.10" --jq '.published_at')"
          test -n "$published"
          test "$published" != null
          echo "PUBLISHED_EXACT_TAG_COMMIT=$tagged_commit"
          echo "RELEASE_PUBLISHED=true; independent published-ZIP validation pending release-archive workflow"
